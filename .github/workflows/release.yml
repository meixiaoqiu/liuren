name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.0.0 或 v1.0.0"
        required: true
        type: string
      release_type:
        description: "发布类型"
        required: true
        default: test
        type: choice
        options:
          - test
          - release

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release information
        id: release_info
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本号格式无效：$INPUT_VERSION" >&2
            echo "请使用类似 1.0.0、v1.0.0 或 1.0.0-beta.1 的格式。" >&2
            exit 1
          fi

          tag="v${version}"
          archive="liuren-${tag}.zip"

          if [[ "$INPUT_RELEASE_TYPE" == "test" ]]; then
            prerelease="true"
            title="liuren ${tag} (Test)"
          else
            prerelease="false"
            title="liuren ${tag}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Package repository
        env:
          TAG_NAME: ${{ steps.release_info.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.release_info.outputs.archive }}
        run: |
          git archive \
            --format=zip \
            --prefix="liuren-${TAG_NAME}/" \
            --output="$ARCHIVE_NAME" \
            HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.release_info.outputs.archive }}
